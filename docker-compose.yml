  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

  # ─── Automated Backup ─────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdppassword}
      POSTGRES_DB: ${POSTGRES_DB:-cdpdb}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: >
      sh -c "
        echo '0 3 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 6
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # prometheus_data:
  # grafana_data:
  # superset_data:
  backup_data:
