version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdppassword}
      POSTGRES_DB: ${POSTGRES_DB:-cdpdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Migrations ───────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: shared/Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
      - ./shared:/app/shared

  # ─── Collector API ────────────────────────────────────────────────────────
  collector:
    build:
      context: services/collector
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Event Processor (Celery) ─────────────────────────────────────────────
  processor:
    build:
      context: services/processor
      dockerfile: Dockerfile
    command: celery -A app.worker worker -l info -Q cdp_events -c 4
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Batch Ingestion ──────────────────────────────────────────────────────
  ingestion:
    build:
      context: services/ingestion
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      LOYALTY_DB_URL: ${LOYALTY_DB_URL:-}
      SALES_DB_URL: ${SALES_DB_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Segmentation Engine ──────────────────────────────────────────────────
  segmentation:
    build:
      context: services/segmentation
      dockerfile: Dockerfile
    command: celery -A app.worker worker -l info -Q cdp_segments -c 2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Activation Service ───────────────────────────────────────────────────
  activation:
    build:
      context: services/activation
      dockerfile: Dockerfile
    command: celery -A app.worker worker -l info -Q cdp_activations -c 2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      ESMS_API_KEY: ${ESMS_API_KEY:-}
      ESMS_SECRET_KEY: ${ESMS_SECRET_KEY:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Admin API ────────────────────────────────────────────────────────────
  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Admin UI ─────────────────────────────────────────────────────────────
  ui:
    build:
      context: services/ui
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8002
      NEXT_PUBLIC_COLLECTOR_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Celery Beat (scheduler) ──────────────────────────────────────────────
  celery-beat:
    build:
      context: services/processor
      dockerfile: Dockerfile
    command: celery -A app.worker beat -l info --scheduler celery.beat:PersistentScheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Nginx reverse proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sdk/js/dist:/usr/share/nginx/html/sdk:ro
    depends_on:
      - collector
      - api
      - ui
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
