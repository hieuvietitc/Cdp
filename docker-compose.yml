  #     - prometheus
  #   restart: unless-stopped

  # ─── Postgres Exporter ────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Redis Exporter ───────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.57.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Apache Superset (BI Dashboards) ──────────────────────────────────────
