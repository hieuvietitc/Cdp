version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdppassword}
      POSTGRES_DB: ${POSTGRES_DB:-cdpdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "4432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # maxmemory-policy allkeys-lru: when Redis is full, evict LRU keys
    # (rate limit counters and write_key caches are expendable)
    # maxmemory 512mb: tune based on available RAM (events stream + caches)
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Migrations ───────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: shared/Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
      - ./shared:/app/shared

  # ─── Collector API ────────────────────────────────────────────────────────
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./sdk/js/dist:/sdk/dist:ro
    ports:
      - "4001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Event Processor (Celery) ─────────────────────────────────────────────
  # Scale horizontally for 100K-1M events/day:
  #   docker compose up --scale processor=3
  # Each instance gets a unique CONSUMER_NAME (hostname-based) automatically.
  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    command: celery -A app.worker worker -l info -Q cdp_events -c ${PROCESSOR_CONCURRENCY:-8}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Tune event batch size from Redis Streams (higher = more throughput, more RAM)
      STREAM_BATCH_SIZE: ${STREAM_BATCH_SIZE:-100}
      # Warn when stream lag exceeds this threshold
      STREAM_LAG_WARN: ${STREAM_LAG_WARN:-10000}
      DB_POOL_SIZE: 10
      DB_POOL_MAX_OVERFLOW: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Batch Ingestion ──────────────────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      LOYALTY_DB_URL: ${LOYALTY_DB_URL:-}
      SALES_DB_URL: ${SALES_DB_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Segmentation Engine ──────────────────────────────────────────────────
  segmentation:
    build:
      context: .
      dockerfile: services/segmentation/Dockerfile
    command: celery -A app.worker worker -l info -Q cdp_segments -c 2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Activation Service ───────────────────────────────────────────────────
  activation:
    build:
      context: .
      dockerfile: services/activation/Dockerfile
    command: celery -A app.worker worker -l info -Q cdp_activations -c 2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      ESMS_API_KEY: ${ESMS_API_KEY:-}
      ESMS_SECRET_KEY: ${ESMS_SECRET_KEY:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Admin API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # REQUIRED: set a strong secret in .env before production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000,http://localhost:4100}
    ports:
      - "4002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Admin UI ─────────────────────────────────────────────────────────────
  ui:
    build:
      context: services/ui
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4002
      NEXT_PUBLIC_COLLECTOR_URL: http://localhost:4001
    ports:
      - "4000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Celery Beat (scheduler) ──────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    command: celery -A app.worker beat -l info --scheduler celery.beat:PersistentScheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Nginx reverse proxy ──────────────────────────────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./sdk/js/dist:/usr/share/nginx/html/sdk:ro
  #   depends_on:
  #     - collector
  #     - api
  #     - ui
  #   restart: unless-stopped

  # ─── PgBouncer (connection pooler) ───────────────────────────────────────
  pgbouncer:
    # edoburu/pgbouncer uses semver+patches (e.g. 1.22.1-p0), not bare 1.22
    image: edoburu/pgbouncer:1.22.1-p0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Metrics Exporter ─────────────────────────────────────────────────────
  metrics:
    build:
      context: services/metrics
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdppassword}@postgres:5432/${POSTGRES_DB:-cdpdb}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ─── Prometheus ───────────────────────────────────────────────────────────
