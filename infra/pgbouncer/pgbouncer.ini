[databases]
cdpdb = host=postgres port=5432 dbname=cdpdb pool_size=25

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; transaction-mode pooling: safest for SQLAlchemy without server-side state
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3

; connection health
server_reset_query = DISCARD ALL
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; expose stats endpoint
admin_users = cdp
stats_users = cdp
