worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Upstream services ──────────────────────────────────────────────
    upstream collector {
        server collector:8000;
    }

    upstream api {
        server api:8000;
    }

    upstream ui {
        server ui:3000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream superset {
        server superset:8088;
    }

    # ─── Logging ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time $status "$request" $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    # ─── Collector (event ingestion, high traffic) ───────────────────────
    server {
        listen 80;
        server_name collect.localhost;

        location /sdk/ {
            alias /usr/share/nginx/html/sdk/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=3600";
        }

        location / {
            proxy_pass http://collector;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Allow cross-origin from website
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    # ─── Admin API ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.localhost;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ─── Admin UI (default) ─────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ─── Grafana ────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name grafana.localhost;

        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── Superset ───────────────────────────────────────────────────────
    server {
        listen 80;
        server_name superset.localhost;

        location / {
            proxy_pass http://superset;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300;
        }
    }
}
