global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: cdp

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cdp_collector"
    static_configs:
      - targets: ["collector:8000"]
    metrics_path: /metrics

  - job_name: "cdp_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "cdp_metrics_exporter"
    static_configs:
      - targets: ["metrics:8000"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
